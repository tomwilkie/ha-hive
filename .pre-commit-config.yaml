repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      # The testing skill's rule files hold deliberately bad examples and are
      # kept verbatim from the library, so ruff leaves them alone.
      - id: ruff-check
        args: [--fix]
        exclude: ^\.claude/
      - id: ruff-format
        exclude: ^\.claude/
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      # Configured in pyproject.toml so a bare `codespell` run agrees with the hook.
      - id: codespell
        exclude_types: [json]
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        args: [--pedantic]
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.21
    hooks:
      # uv.lock must match pyproject.toml.
      - id: uv-lock
