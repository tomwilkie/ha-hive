name: CI

# No `paths:` filter on purpose: every job always reports, so each one can be
# a required check without blocking docs-only pull requests. The suite runs in
# seconds, so there is nothing worth skipping.
on:
  push:
    branches:
      - main
  pull_request:

# Least privilege: the default GITHUB_TOKEN is read-only.
permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_PYTHON: "3.14"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-

      - name: Install dependencies
        run: uv sync --locked

      - name: Run all pre-commit hooks
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Coverage is measured on every run; pyproject.toml sets the floor.
      - name: Run tests
        run: uv run --locked pytest --tb=short

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Only published on a moving branch, and meant to track core's current
      # validation rules, so it is not pinned to a commit.
      - uses: home-assistant/actions/hassfest@master  # zizmor: ignore[unpinned-uses]

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # As for hassfest: a moving branch is the only thing to track.
      - uses: hacs/action@main  # zizmor: ignore[unpinned-uses]
        with:
          category: integration
          # The integration keeps core's `hive` domain, whose brand assets live
          # under core_integrations in the brands repository; HACS only looks
          # in custom_integrations, and the frontend already shows the icon.
          ignore: brands

  requirements:
    name: Requirements under Home Assistant's pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      # Home Assistant installs the manifest's requirements with uv under its
      # own package_constraints.txt; a conflict fails at startup with
      # RequirementsNotFound, which no test can show.
      - name: Install the manifest requirements with core's constraints
        run: scripts/check_requirements
